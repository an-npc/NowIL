# SEC football NIL valuation model configuration.

sport: football
conference: SEC
season: 2025

# Ordered position list. The index in this list is the position_id used by the
# embedding layer. Keep this order stable across runs.
positions:
  - QB
  - WR
  - TE
  - MLB
  - S

# SEC team names as they appear in the CFBD API.
sec_teams:
  - Alabama
  - Arkansas
  - Auburn
  - Florida
  - Georgia
  - Kentucky
  - LSU
  - Mississippi State
  - Missouri
  - Oklahoma
  - Ole Miss
  - South Carolina
  - Tennessee
  - Texas
  - Texas A&M
  - Vanderbilt

# Per-position stat fields pulled from CFBD. Fields not listed for a position
# are zero-filled for that player. Do not rename fields here without updating
# data/preprocessing.py.
position_stats:
  QB:
    - pass_attempts
    - pass_completions
    - pass_yards
    - pass_tds
    - pass_ints_thrown
    - pass_completion_pct
    - qbr
    - rush_attempts
    - rush_yards
    - rush_tds
  WR:
    - receptions
    - targets
    - receiving_yards
    - receiving_tds
    - yards_per_reception
    - longest_reception
    - rush_attempts
    - rush_yards
  TE:
    - receptions
    - targets
    - receiving_yards
    - receiving_tds
    - yards_per_reception
    - blocking_snaps
  MLB:
    - total_tackles
    - solo_tackles
    - tfl
    - sacks
    - qb_hurries
    - def_ints
    - pass_breakups
    - forced_fumbles
  S:
    - total_tackles
    - solo_tackles
    - def_ints
    - pass_breakups
    - forced_fumbles
    - fumble_recoveries
    - defensive_tds

# Union of all stat feature names. Regenerate if position_stats changes.
# Order matters: this is the input vector order used by the model.
stat_feature_order:
  - pass_attempts
  - pass_completions
  - pass_yards
  - pass_tds
  - pass_ints_thrown
  - pass_completion_pct
  - qbr
  - rush_attempts
  - rush_yards
  - rush_tds
  - receptions
  - targets
  - receiving_yards
  - receiving_tds
  - yards_per_reception
  - longest_reception
  - blocking_snaps
  - total_tackles
  - solo_tackles
  - tfl
  - sacks
  - qb_hurries
  - def_ints
  - pass_breakups
  - forced_fumbles
  - fumble_recoveries
  - defensive_tds

# Shared contextual features applied to all positions.
context_features:
  - class_year_ordinal    # FR=1, SO=2, JR=3, SR=4, GR=5
  - games_played
  - team_win_pct
  - team_strength_of_schedule
  - school_athletic_revenue_usd
  - social_followers_total

# Model hyperparameters.
model:
  position_embedding_dim: 8
  hidden_layers: [128, 64, 32]
  dropout: 0.2
  activation: relu
  # Predict log1p of NIL USD. Undo at inference time with expm1.
  log_target: true
  loss: huber
  huber_delta: 1.0

training:
  batch_size: 32
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  k_folds: 5
  patience: 30
  seed: 42
  device: cpu

lstm:
  sequence_length: 5
  hidden_dim: 32
  num_layers: 1
  dropout: 0.1
  # LSTM head outputs an additive adjustment in log-space on top of the season
  # model's prediction.
  output: log_adjustment

paths:
  cache_dir: data/cache
  dataset_csv: data/sec_2025.csv
  checkpoint_dir: training/checkpoints
  knight_newhouse_csv: data/cache/knight_newhouse_sec.csv
  social_followers_csv: data/cache/social_followers.csv
  on3_manual_csv: data/cache/on3_manual.csv
